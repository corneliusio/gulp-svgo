# Publishes to npm via trusted publishing (OIDC) — no npm token secret.
# Requires a trusted publisher configured for this repo/workflow on npmjs.com.
name: publish

on:
    push:
        tags: ['v*']

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '24'
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm run typecheck
            - run: pnpm run test
            - run: pnpm run build
            - name: Verify tag matches package version
              run: |
                  [ "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" ]
            - name: Skip if version is already on the registry
              id: check
              run: |
                  version=$(node -p "require('./package.json').version")
                  if npm view "gulp-svgo@${version}" version >/dev/null 2>&1; then
                      echo "Version ${version} already published, skipping."
                      echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "published=false" >> "$GITHUB_OUTPUT"
                  fi
            - run: npm publish
              if: steps.check.outputs.published == 'false'
